  <title id="fig-askai-v2-t">The second proposed Ask AI setup flow</title>
  <desc id="fig-askai-v2-d">A revised branching flow from the Ask AI tab. Existing prompts and configurations open a view and edit screen with four separate edit paths. The empty state splits into creating a prompt, then optionally attaching it to a new or existing configuration, or creating a configuration, then choosing a template or a new prompt.</desc>
