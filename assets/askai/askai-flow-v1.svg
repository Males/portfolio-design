  <title id="fig-askai-v1-t">The first proposed Ask AI setup flow</title>
  <desc id="fig-askai-v1-d">A branching flow from the Ask AI tab. A check for existing prompts and configurations splits into a table view and an empty state, which fan out into separate paths to delete, view, edit and analyse prompts and configurations, a six step configuration form and two routes to create a prompt.</desc>
