<svg xmlns="http://www.w3.org/2000/svg" id="fig-zen-journey" viewBox="0 0 1600 640" width="1600" height="640" role="img" aria-labelledby="fig-zen-journey-t fig-zen-journey-d">
  <title id="fig-zen-journey-t">Three bookings travelling as one container</title>
  <desc id="fig-zen-journey-d">Three bookings load bananas and broccoli, apples and carrots at separate stops. At stop D the goods are consolidated into one container that travels by road, sea and road to stop G, where it is unpacked and each good travels on to its own delivery stop.</desc>
  <style>#fig-zen-journey text { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }</style>
  <defs><marker id="fig-zen-journey-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#616161"/></marker></defs>
  <rect width="1600" height="640" fill="#F7F7F5"/>
  <path d="M200,130 H328" fill="none" stroke="#616161" stroke-width="2" marker-end="url(#fig-zen-journey-a)"/>
  <text x="265" y="114" font-size="15" font-weight="400" fill="#525252" text-anchor="middle">Road · Bananas</text>
  <path d="M390,130 H608 Q620,130 620,142 V308 Q620,320 632,320 H668" fill="none" stroke="#616161" stroke-width="2" marker-end="url(#fig-zen-journey-a)"/>
  <text x="505" y="114" font-size="15" font-weight="400" fill="#525252" text-anchor="middle">Road · Bananas, broccoli</text>
  <path d="M200,320 H668" fill="none" stroke="#616161" stroke-width="2" marker-end="url(#fig-zen-journey-a)"/>
  <text x="435" y="304" font-size="15" font-weight="400" fill="#525252" text-anchor="middle">Road · Apples</text>
  <path d="M200,510 H608 Q620,510 620,498 V332 Q620,320 632,320 H668" fill="none" stroke="#616161" stroke-width="2" marker-end="url(#fig-zen-journey-a)"/>
  <text x="410" y="494" font-size="15" font-weight="400" fill="#525252" text-anchor="middle">Road · Carrots</text>
  <path d="M730,320 H828" fill="none" stroke="#616161" stroke-width="2" marker-end="url(#fig-zen-journey-a)"/>
  <text x="780" y="304" font-size="15" font-weight="400" fill="#525252" text-anchor="middle">Road</text>
  <path d="M890,320 H988" fill="none" stroke="#616161" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#fig-zen-journey-a)"/>
  <text x="940" y="304" font-size="15" font-weight="400" fill="#525252" text-anchor="middle">Sea</text>
  <path d="M1050,320 H1148" fill="none" stroke="#616161" stroke-width="2" marker-end="url(#fig-zen-journey-a)"/>
  <text x="1100" y="304" font-size="15" font-weight="400" fill="#525252" text-anchor="middle">Road</text>
  <path d="M1210,320 H1238 Q1250,320 1250,308 V142 Q1250,130 1262,130 H1468" fill="none" stroke="#616161" stroke-width="2" marker-end="url(#fig-zen-journey-a)"/>
  <text x="1360" y="114" font-size="15" font-weight="400" fill="#525252" text-anchor="middle">Road · Apples</text>
  <path d="M1210,320 H1468" fill="none" stroke="#616161" stroke-width="2" marker-end="url(#fig-zen-journey-a)"/>
  <text x="1340" y="304" font-size="15" font-weight="400" fill="#525252" text-anchor="middle">Road · Bananas</text>
  <path d="M1210,320 H1238 Q1250,320 1250,332 V498 Q1250,510 1262,510 H1338" fill="none" stroke="#616161" stroke-width="2" marker-end="url(#fig-zen-journey-a)"/>
  <text x="1357" y="445" font-size="15" font-weight="400" fill="#525252" text-anchor="middle">Road · Carrots, broccoli</text>
  <path d="M1400,510 H1498" fill="none" stroke="#616161" stroke-width="2" marker-end="url(#fig-zen-journey-a)"/>
  <text x="1450" y="494" font-size="15" font-weight="400" fill="#525252" text-anchor="middle">Road · Broccoli</text>
  <rect x="140" y="100" width="60" height="60" rx="4" fill="#181818"/>
  <text x="170" y="136" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">AA</text>
  <text x="170" y="186" font-size="15" font-weight="400" fill="#181818" text-anchor="middle">Load bananas</text>
  <rect x="330" y="100" width="60" height="60" rx="4" fill="#181818"/>
  <text x="360" y="136" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">AB</text>
  <text x="360" y="186" font-size="15" font-weight="400" fill="#181818" text-anchor="middle">Load broccoli</text>
  <rect x="140" y="290" width="60" height="60" rx="4" fill="#181818"/>
  <text x="170" y="326" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">B</text>
  <text x="170" y="376" font-size="15" font-weight="400" fill="#181818" text-anchor="middle">Load apples</text>
  <rect x="140" y="480" width="60" height="60" rx="4" fill="#181818"/>
  <text x="170" y="516" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">C</text>
  <text x="170" y="566" font-size="15" font-weight="400" fill="#181818" text-anchor="middle">Load carrots</text>
  <rect x="670" y="290" width="60" height="60" rx="4" fill="#181818"/>
  <text x="700" y="326" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">D</text>
  <text x="700" y="376" font-size="15" font-weight="400" fill="#181818" text-anchor="middle">Consolidate into</text>
  <text x="700" y="395" font-size="15" font-weight="400" fill="#181818" text-anchor="middle">one container</text>
  <rect x="830" y="290" width="60" height="60" rx="4" fill="#181818"/>
  <text x="860" y="326" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">E</text>
  <rect x="990" y="290" width="60" height="60" rx="4" fill="#181818"/>
  <text x="1020" y="326" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">F</text>
  <rect x="1150" y="290" width="60" height="60" rx="4" fill="#181818"/>
  <text x="1180" y="326" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">G</text>
  <text x="1180" y="376" font-size="15" font-weight="400" fill="#181818" text-anchor="middle">Unpack the</text>
  <text x="1180" y="395" font-size="15" font-weight="400" fill="#181818" text-anchor="middle">container</text>
  <rect x="1470" y="100" width="60" height="60" rx="4" fill="#181818"/>
  <text x="1500" y="136" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">H</text>
  <text x="1500" y="186" font-size="15" font-weight="400" fill="#181818" text-anchor="middle">Unload apples</text>
  <rect x="1470" y="290" width="60" height="60" rx="4" fill="#181818"/>
  <text x="1500" y="326" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">I</text>
  <text x="1500" y="376" font-size="15" font-weight="400" fill="#181818" text-anchor="middle">Unload bananas</text>
  <rect x="1340" y="480" width="60" height="60" rx="4" fill="#181818"/>
  <text x="1370" y="516" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">JJ</text>
  <text x="1370" y="566" font-size="15" font-weight="400" fill="#181818" text-anchor="middle">Unload carrots</text>
  <rect x="1500" y="480" width="60" height="60" rx="4" fill="#181818"/>
  <text x="1530" y="516" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">JK</text>
  <text x="1530" y="566" font-size="15" font-weight="400" fill="#181818" text-anchor="middle">Unload broccoli</text>
  <text x="40" y="136" font-size="16" font-weight="600" fill="#525252" text-anchor="start">Booking 1</text>
  <text x="40" y="326" font-size="16" font-weight="600" fill="#525252" text-anchor="start">Booking 2</text>
  <text x="40" y="516" font-size="16" font-weight="600" fill="#525252" text-anchor="start">Booking 3</text>
  <text x="40" y="612" font-size="15" font-weight="400" fill="#616161" text-anchor="start">Each square is a stop with a place and a time. Solid lines are road legs, the dashed line is the sea leg.</text>
</svg>
